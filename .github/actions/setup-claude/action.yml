name: setup-claude
description: Claude Code CLI (pinned) plus what its Linux sandbox needs (bubblewrap, socat, unprivileged user namespaces).

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - shell: bash
      run: |
        set -euo pipefail
        sudo apt-get install -y -qq bubblewrap socat >/dev/null
        # Ubuntu 24.04 blocks unprivileged user namespaces by default; bubblewrap needs them.
        sudo sysctl -q -w kernel.apparmor_restrict_unprivileged_userns=0 || true
        npm install -g --silent --no-audit --no-fund @anthropic-ai/claude-code@2.1.318
        claude --version
