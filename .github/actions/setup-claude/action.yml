name: setup-claude
description: Claude Code CLI (pinned) plus the glyph-sandbox image that agents' sbx command runs in.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - shell: bash
      run: |
        set -euo pipefail
        npm install -g --silent --no-audit --no-fund @anthropic-ai/claude-code@2.1.318
        claude --version
        # Agents' only shell (tools/agent-bin/sbx) runs in this image with no network.
        docker build -q -t glyph-sandbox "${{ github.action_path }}/../../../tools/sandbox"
