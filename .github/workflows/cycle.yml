name: cycle

# One development cycle: SPEC section 12 steps 2 to 10. Called six times at most from
# nightly.yml. Each cycle re-reads repo state, because each job checks out the base
# branch fresh. Jobs use `if: always()` so one failed step does not stop the rest.
# Never sets `environment`: phase.yml and bench.yml bind their own.

on:
  workflow_call:
    inputs:
      cycle:
        type: string
        required: true
      run_date:
        type: string
        required: true
      base_branch:
        type: string
        required: true
      agent_mode:
        type: string
        required: true
      bench_on:
        type: string
        required: true
      attack:
        type: string
        required: false
        default: ""

env:
  BASE_BRANCH: ${{ inputs.base_branch }}
  RUN_DATE: ${{ inputs.run_date }}
  GLYPH_RUN: ${{ github.run_id }}
  CYCLE: ${{ inputs.cycle }}
  AGENT_MODE: ${{ inputs.agent_mode }}

permissions: {}

jobs:
  open:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_branch }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-tools
      - name: Open the cycle in the audit log
        run: python -m tools.mergebot open

  design:
    needs: open
    if: needs.open.result == 'success'
    uses: ./.github/workflows/phase.yml
    permissions:
      contents: write
      pull-requests: write
      issues: write
    with:
      phase: design
      cycle: ${{ inputs.cycle }}
      run_date: ${{ inputs.run_date }}
      base_branch: ${{ inputs.base_branch }}
      agent_mode: ${{ inputs.agent_mode }}
      attack: ${{ inputs.attack }}
    secrets: inherit

  vote:
    needs: design
    if: always()
    uses: ./.github/workflows/phase.yml
    permissions:
      contents: write
      pull-requests: write
      issues: write
    with:
      phase: vote
      cycle: ${{ inputs.cycle }}
      run_date: ${{ inputs.run_date }}
      base_branch: ${{ inputs.base_branch }}
      agent_mode: ${{ inputs.agent_mode }}
      attack: ${{ inputs.attack }}
    secrets: inherit

  decide:
    needs: vote
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_branch }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-tools
      - run: python -m tools.mergebot decide

  implement:
    needs: decide
    if: always()
    uses: ./.github/workflows/phase.yml
    permissions:
      contents: write
      pull-requests: write
      issues: write
    with:
      phase: implement
      cycle: ${{ inputs.cycle }}
      run_date: ${{ inputs.run_date }}
      base_branch: ${{ inputs.base_branch }}
      agent_mode: ${{ inputs.agent_mode }}
      attack: ${{ inputs.attack }}
    secrets: inherit

  check-plan:
    needs: implement
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      count: ${{ steps.list.outputs.count }}
      matrix: ${{ steps.list.outputs.matrix }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Lists open agent PRs only. No agent code runs in this job.
      - name: List open agent PRs
        id: list
        run: |
          # shellcheck disable=SC2016 # $ENV is a jq variable, not a shell one
          q='[.[] | select(.headRefName | startswith("agent/")) | select(.baseRefName == $ENV.BASE_BRANCH) | {pr: .number, sha: .headRefOid}]'
          fields=number,headRefName,headRefOid,baseRefName
          count=$(gh pr list -R "$GITHUB_REPOSITORY" --state open --limit 200 --json "$fields" --jq "$q | length")
          matrix=$(gh pr list -R "$GITHUB_REPOSITORY" --state open --limit 200 --json "$fields" \
            --jq "{include: ($q | if length == 0 then [{pr: 0, sha: \"\"}] else . end)} | tojson")
          {
            echo "count=$count"
            echo "matrix=$matrix"
          } >> "$GITHUB_OUTPUT"

  check:
    needs: check-plan
    if: always() && needs['check-plan'].result == 'success' && needs['check-plan'].outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs['check-plan'].outputs.matrix) }}
    steps:
      # The sandbox image and the check code come from the base branch, never from the PR.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_branch }}
          path: base
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
          path: pr
          persist-credentials: false
      - name: Build sandbox from base
        run: docker build -t glyph-sandbox base/tools/sandbox
      - name: Run check in sandbox
        env:
          PR: ${{ matrix.pr }}
          SHA: ${{ matrix.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          BASE_SHA=$(git -C base rev-parse HEAD)
          docker run --rm --network none --read-only --memory 4g --cpus 2 --pids-limit 512 \
            --tmpfs /tmp:rw,size=1g -e PYTHONDONTWRITEBYTECODE=1 -e PYTHONPATH=/src \
            -v "$PWD/base:/src:ro" -v "$PWD/pr:/work:ro" -v "$RUNNER_TEMP/out:/out" \
            -w /src glyph-sandbox \
            python -m tools.check.run --repo /work --out /out/result.json \
              --pr "$PR" --sha "$SHA" --base-sha "$BASE_SHA"
          mkdir -p "$RUNNER_TEMP/check"
          cp "$RUNNER_TEMP/out/result.json" "$RUNNER_TEMP/check/$PR.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-c${{ inputs.cycle }}-${{ matrix.pr }}
          path: ${{ runner.temp }}/check/${{ matrix.pr }}.json
          if-no-files-found: warn
          retention-days: 14

  review:
    needs: check
    if: always()
    uses: ./.github/workflows/phase.yml
    permissions:
      contents: write
      pull-requests: write
      issues: write
    with:
      phase: review
      cycle: ${{ inputs.cycle }}
      run_date: ${{ inputs.run_date }}
      base_branch: ${{ inputs.base_branch }}
      agent_mode: ${{ inputs.agent_mode }}
      attack: ${{ inputs.attack }}
    secrets: inherit

  bench:
    needs: [review, check-plan]
    if: always() && inputs.bench_on == 'true' && needs['check-plan'].result == 'success' && needs['check-plan'].outputs.count != '0'
    uses: ./.github/workflows/bench.yml
    permissions:
      contents: write
    with:
      mode: gate
      cycle: ${{ inputs.cycle }}
      base_branch: ${{ inputs.base_branch }}
      prs: ${{ needs['check-plan'].outputs.matrix }}
    secrets: inherit

  merge:
    needs: [check, bench]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_branch }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-tools
      - name: Fetch check results
        if: needs.check.result != 'skipped'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: check-c${{ inputs.cycle }}-*
          path: ${{ runner.temp }}/checks
          merge-multiple: true
      - name: Fetch bench results
        if: needs.bench.result == 'success'
        uses: actions/download-artifact@v4
        with:
          pattern: bench-gate-c${{ inputs.cycle }}-*
          path: ${{ runner.temp }}/bench-gate
          merge-multiple: true
      - name: Apply gate and merge at most one PR
        run: |
          # Results live outside the checkout: checks/ and bench/ are tracked, and a dirty tree breaks the bot's pull --rebase.
          checks="$RUNNER_TEMP/checks" gate="$RUNNER_TEMP/bench-gate"
          mkdir -p "$checks"
          if [ -d "$gate" ]; then python -m tools.mergebot bench "$gate" --scope gate; fi
          args=("$checks")
          if [ -d "$gate" ]; then args+=("$gate"); fi
          python -m tools.mergebot merge "${args[@]}"

  use:
    needs: merge
    if: always()
    uses: ./.github/workflows/phase.yml
    permissions:
      contents: write
      pull-requests: write
      issues: write
    with:
      phase: use
      cycle: ${{ inputs.cycle }}
      run_date: ${{ inputs.run_date }}
      base_branch: ${{ inputs.base_branch }}
      agent_mode: ${{ inputs.agent_mode }}
      attack: ${{ inputs.attack }}
    secrets: inherit
