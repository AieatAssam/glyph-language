name: nightly

# The nightly run. Order: open (merge bot), architect, cycles 1 to 6 (each guarded by
# cycles_per_night from RULES.md, capped at 6), then bench-nightly, scribe, close, release, site.
# Secrets reach cycle.yml and below only through `secrets: inherit`. Every call job sets the
# permission ceiling for its callee. Nothing here sets `environment` on a call job.

on:
  schedule:
    - cron: "17 3 * * *"
    # Fast runs: every hour until main holds fast_until_conformance_tests (RULES.md) conformance
    # tests (setup then skips them).
    # A run takes about 50 minutes and the concurrency group queues at most one more.
    - cron: "17 0-2,4-23 * * *"
  workflow_dispatch:
    inputs:
      base_branch:
        description: Branch that plays the role of main
        type: string
        default: main
      agent_mode:
        description: live runs Claude Code, scripted runs the canned agents
        type: choice
        options: [live, scripted]
        default: live
      cycles:
        description: Cycles this night, 0 to 6. Empty uses cycles_per_night from RULES.md
        type: string
        required: false
      attack:
        description: Scripted runs only. Passed to the phase and cycle jobs as SCRIPTED_ATTACK
        type: string
        required: false

concurrency:
  group: nightly
  cancel-in-progress: false

permissions: {}

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      run_date: ${{ steps.vars.outputs.run_date }}
      cycles: ${{ steps.vars.outputs.cycles }}
      bench_on: ${{ steps.vars.outputs.bench_on }}
      base_branch: ${{ steps.vars.outputs.base_branch }}
      agent_mode: ${{ steps.vars.outputs.agent_mode }}
      nightly_bench: ${{ steps.vars.outputs.nightly_bench }}
      fixed_point: ${{ steps.vars.outputs.fixed_point }}
      skip: ${{ steps.vars.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_branch || 'main' }}
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - name: Read nightly settings
        id: vars
        env:
          CYCLES_IN: ${{ inputs.cycles }}
          BASE_IN: ${{ inputs.base_branch || 'main' }}
          MODE_IN: ${{ inputs.agent_mode || 'live' }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          python3 - <<'PY'
          import datetime, os, pathlib, re, yaml
          text = pathlib.Path("governance/RULES.md").read_text(encoding="utf-8")
          block = re.search(r"^```yaml rules\n(.*?)^```", text, re.S | re.M).group(1)
          rules = yaml.safe_load(block)
          cycles = int(rules["cycles_per_night"])
          if os.environ["CYCLES_IN"].strip():
              cycles = int(os.environ["CYCLES_IN"])
          cycles = max(0, min(6, cycles))
          run_date = datetime.datetime.now(datetime.timezone.utc).date().isoformat()
          bench_on = "true" if rules.get("gates", {}).get("bench") else "false"
          card_ok = os.path.exists("spec/card.md") and os.path.exists("bin/glyphc")
          nightly_bench = "true" if rules.get("gates", {}).get("bench") or card_ok else "false"
          fixed_point = "true" if rules.get("gates", {}).get("fixed_point") else "false"
          # A fast run (any schedule but the 03:17 one) does nothing once the implementation is far enough
          # along: the conformance suite on this branch has reached the owner's target.
          skip = "false"
          if os.environ.get("SCHEDULE") not in ("", "17 3 * * *"):
              have = len(list(pathlib.Path("conformance").rglob("*.test")))
              skip = "true" if have >= int(rules.get("fast_until_conformance_tests", 0)) else "false"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"skip={skip}\n")
              out.write(f"run_date={run_date}\n")
              out.write(f"cycles={cycles}\n")
              out.write(f"bench_on={bench_on}\n")
              out.write(f"base_branch={os.environ['BASE_IN']}\n")
              out.write(f"agent_mode={os.environ['MODE_IN']}\n")
              out.write(f"nightly_bench={nightly_bench}\n")
              out.write(f"fixed_point={fixed_point}\n")
          PY

  open:
    needs: setup
    if: needs.setup.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_BRANCH: ${{ needs.setup.outputs.base_branch }}
      RUN_DATE: ${{ needs.setup.outputs.run_date }}
      GLYPH_RUN: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.base_branch }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-tools
      - name: Verify audit chain and open the night
        run: python -m tools.mergebot open --night

  architect:
    needs: [setup, open]
    if: needs.open.result == 'success'
    uses: ./.github/workflows/phase.yml
    permissions:
      contents: write
      pull-requests: write
      issues: write
    with:
      phase: architect
      cycle: "0"
      run_date: ${{ needs.setup.outputs.run_date }}
      base_branch: ${{ needs.setup.outputs.base_branch }}
      agent_mode: ${{ needs.setup.outputs.agent_mode }}
      attack: ${{ inputs.attack || '' }}
    secrets: inherit

  cycle-1:
    needs: [setup, open, architect]
    if: always() && needs.open.result == 'success' && fromJSON(needs.setup.outputs.cycles) >= 1
    uses: ./.github/workflows/cycle.yml
    permissions:
      contents: write
      pull-requests: write
      issues: write
    with:
      cycle: "1"
      run_date: ${{ needs.setup.outputs.run_date }}
      base_branch: ${{ needs.setup.outputs.base_branch }}
      agent_mode: ${{ needs.setup.outputs.agent_mode }}
      attack: ${{ inputs.attack || '' }}
      bench_on: ${{ needs.setup.outputs.bench_on }}
    secrets: inherit

  cycle-2:
    needs: [setup, open, cycle-1]
    if: always() && needs.open.result == 'success' && fromJSON(needs.setup.outputs.cycles) >= 2
    uses: ./.github/workflows/cycle.yml
    permissions:
      contents: write
      pull-requests: write
      issues: write
    with:
      cycle: "2"
      run_date: ${{ needs.setup.outputs.run_date }}
      base_branch: ${{ needs.setup.outputs.base_branch }}
      agent_mode: ${{ needs.setup.outputs.agent_mode }}
      attack: ${{ inputs.attack || '' }}
      bench_on: ${{ needs.setup.outputs.bench_on }}
    secrets: inherit

  cycle-3:
    needs: [setup, open, cycle-2]
    if: always() && needs.open.result == 'success' && fromJSON(needs.setup.outputs.cycles) >= 3
    uses: ./.github/workflows/cycle.yml
    permissions:
      contents: write
      pull-requests: write
      issues: write
    with:
      cycle: "3"
      run_date: ${{ needs.setup.outputs.run_date }}
      base_branch: ${{ needs.setup.outputs.base_branch }}
      agent_mode: ${{ needs.setup.outputs.agent_mode }}
      attack: ${{ inputs.attack || '' }}
      bench_on: ${{ needs.setup.outputs.bench_on }}
    secrets: inherit

  cycle-4:
    needs: [setup, open, cycle-3]
    if: always() && needs.open.result == 'success' && fromJSON(needs.setup.outputs.cycles) >= 4
    uses: ./.github/workflows/cycle.yml
    permissions:
      contents: write
      pull-requests: write
      issues: write
    with:
      cycle: "4"
      run_date: ${{ needs.setup.outputs.run_date }}
      base_branch: ${{ needs.setup.outputs.base_branch }}
      agent_mode: ${{ needs.setup.outputs.agent_mode }}
      attack: ${{ inputs.attack || '' }}
      bench_on: ${{ needs.setup.outputs.bench_on }}
    secrets: inherit

  cycle-5:
    needs: [setup, open, cycle-4]
    if: always() && needs.open.result == 'success' && fromJSON(needs.setup.outputs.cycles) >= 5
    uses: ./.github/workflows/cycle.yml
    permissions:
      contents: write
      pull-requests: write
      issues: write
    with:
      cycle: "5"
      run_date: ${{ needs.setup.outputs.run_date }}
      base_branch: ${{ needs.setup.outputs.base_branch }}
      agent_mode: ${{ needs.setup.outputs.agent_mode }}
      attack: ${{ inputs.attack || '' }}
      bench_on: ${{ needs.setup.outputs.bench_on }}
    secrets: inherit

  cycle-6:
    needs: [setup, open, cycle-5]
    if: always() && needs.open.result == 'success' && fromJSON(needs.setup.outputs.cycles) >= 6
    uses: ./.github/workflows/cycle.yml
    permissions:
      contents: write
      pull-requests: write
      issues: write
    with:
      cycle: "6"
      run_date: ${{ needs.setup.outputs.run_date }}
      base_branch: ${{ needs.setup.outputs.base_branch }}
      agent_mode: ${{ needs.setup.outputs.agent_mode }}
      attack: ${{ inputs.attack || '' }}
      bench_on: ${{ needs.setup.outputs.bench_on }}
    secrets: inherit

  bench-nightly:
    needs: [setup, cycle-1, cycle-2, cycle-3, cycle-4, cycle-5, cycle-6]
    if: always() && needs.setup.outputs.nightly_bench == 'true' && needs.setup.outputs.skip != 'true'
    uses: ./.github/workflows/bench.yml
    permissions:
      contents: write
    with:
      mode: nightly
      cycle: "0"
      base_branch: ${{ needs.setup.outputs.base_branch }}
    secrets: inherit

  base-check:
    needs: setup
    if: needs.setup.outputs.fixed_point == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      # No secrets. The base branch runs through the sandbox, which mounts the checkout read only.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.base_branch }}
          persist-credentials: false
      - name: Base check in the sandbox
        run: bash tools/sandbox/run.sh . "$RUNNER_TEMP/check"
      - uses: actions/upload-artifact@v4
        with:
          name: fixed-point-check
          path: ${{ runner.temp }}/check
          if-no-files-found: error
          retention-days: 30

  fixed-point:
    needs: [setup, base-check, cycle-1, cycle-2, cycle-3, cycle-4, cycle-5, cycle-6]
    if: always() && needs.setup.outputs.fixed_point == 'true' && needs.base-check.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.base_branch }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-tools
      - uses: actions/download-artifact@v4
        with:
          name: fixed-point-check
          path: ${{ runner.temp }}/fp
      - name: Fixed-point check and cutover
        run: |
          set -euo pipefail
          python -m tools.mergebot fixedpoint "$RUNNER_TEMP/fp/result.json"
          python -m tools.mergebot cutover "$RUNNER_TEMP/fp"

  scribe:
    needs: [setup, open, cycle-1, cycle-2, cycle-3, cycle-4, cycle-5, cycle-6, bench-nightly, fixed-point]
    if: always() && needs.open.result == 'success'
    uses: ./.github/workflows/phase.yml
    permissions:
      contents: write
      pull-requests: write
      issues: write
    with:
      phase: scribe
      cycle: "0"
      run_date: ${{ needs.setup.outputs.run_date }}
      base_branch: ${{ needs.setup.outputs.base_branch }}
      agent_mode: ${{ needs.setup.outputs.agent_mode }}
      attack: ${{ inputs.attack || '' }}
    secrets: inherit

  close:
    needs: [setup, scribe]
    if: always() && needs.setup.result == 'success' && needs.setup.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      release: ${{ steps.close.outputs.release }}
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_BRANCH: ${{ needs.setup.outputs.base_branch }}
      RUN_DATE: ${{ needs.setup.outputs.run_date }}
      GLYPH_RUN: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.base_branch }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-tools
      - name: Close the night
        id: close
        run: |
          python -m tools.mergebot close | tee close.log
          if grep -qx 'release=true' close.log; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: [setup, close]
    if: needs.close.outputs.release == 'true'
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
    with:
      base_branch: ${{ needs.setup.outputs.base_branch }}
      run_date: ${{ needs.setup.outputs.run_date }}
    secrets: inherit

  site:
    needs: [setup, close]
    if: always() && needs.setup.outputs.base_branch == 'main' && needs.close.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.base_branch }}
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - name: Build site data
        run: python site/build_data.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/public
      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@v4
