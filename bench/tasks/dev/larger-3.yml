id: larger-3
category: larger
tier: 3
prompt: 'Play a text adventure. The world has five rooms: hall, library, kitchen, cellar and vault. hall connects north to library and east to kitchen. library connects south to hall. kitchen connects west to hall and down to cellar. cellar connects up to kitchen and east to vault, and that east exit is locked until you carry the key. vault connects west to cellar. Items start where they are listed: hall has a lamp, library has a book and a key, kitchen has bread, cellar has wine, vault has gold. Commands, one per line: go DIR moves you; take ITEM and drop ITEM move items between the room and you; look lists the exits and items here; inv lists what you carry. Each command writes one response line. Impossible or unknown commands count as failures. After all commands, write the final line: final ROOM moves N failed M.'
