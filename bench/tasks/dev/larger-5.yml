    open ben

    open cy

    open ben

    open ben

    withdraw ben 34

    deposit cy 22

    deposit cy 23

    transfer ann ben 27

    statement ann

    close ann

    transfer ben cy 8

    deposit cy 14

    '
  expected: 'ann balance 0

