    open ben

    deposit ann 38

    deposit ben 37

    withdraw cy 17

    deposit cy 5

    transfer ann cy 8

    deposit ann -3

    transfer cy ben 38

    deposit ben 24

    statement ben

    deposit ann 27

    statement cy

    deposit cy -3

    withdraw ben 11

    '
  expected: 'ben deposit +37 37

    ben deposit +24 61

    ben balance 61

    rejected: no account cy

    rejected: no account cy

    rejected: no account cy

    rejected: bad amount

    rejected: no account cy

    rejected: no account cy

