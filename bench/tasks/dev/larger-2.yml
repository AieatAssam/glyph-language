id: larger-2
category: larger
tier: 2
prompt: Keep an inventory ledger from commands, one per line. add NAME QTY PRICE raises the stock of NAME by QTY and sets its unit price to PRICE. remove NAME QTY lowers the stock; if the item is unknown or holds less than QTY, reject the command and leave the stock alone. price NAME PRICE changes the unit price of a known item. report appends a report line for every item, sorted by name, showing its quantity, price and value (quantity times price), followed by a total line. Anything malformed or unknown is rejected. Write the log of reports and rejections in order, then the final report, then nothing else.
tests:
- input: 'remove oak 2

    add oak 9 5

    price ash 39

    remove fir 2

    remove elm 3

    report

    report

    '
  expected: 'rejected: unknown item oak

    rejected: unknown item ash

    rejected: unknown item fir

    rejected: unknown item elm

    oak    qty   9 price    5 value     45

    total 45

    oak    qty   9 price    5 value     45

    total 45

    oak    qty   9 price    5 value     45

    total 45

    '
  visible: true
