id: larger-6
category: larger
tier: 3
prompt: 'Drive a robot over a grid. The first line holds the width and height. Then come height map rows: a # is a wall, a . is open, and one R marks the start. The robot starts facing north. The last line holds commands: F moves forward one cell, L and R turn left and right, other letters do nothing. A forward move into a wall or off the map is a bump: the robot stays put and the bump is counted. Coordinates have x growing east and y growing south from the top left. Write the robot position as x y, its facing N, E, S or W, and the bump count as x y FACING bumps N. Then write the map again with every visited cell marked o, the walls kept, and the robot marked @.'
tests:
- input: '8 5

    .#.....#

    ......##

    ...#.#..

    ##.#....

    R..#.#.#

    LFFRFFRFFLFFRFFFFFRF

    '
  expected: '2 3 S bumps 9

    .#.....#

    ......##

    ..o#.#..

    ##@#....

    ooo#.#.#

    '
  visible: true
