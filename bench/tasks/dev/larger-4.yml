id: larger-4
category: larger
tier: 3
prompt: 'Evaluate a mini spreadsheet. Each line is CELL = EXPR. A cell name is a capital letter followed by a row number. An expression is built from integers, cell names, binary + - and *, and parentheses. Cells are evaluated on demand. A reference to a cell that is not defined gives #REF. A cell that depends on itself, directly or through others, gives #CYCLE. A malformed expression gives #ERR. Write every cell as CELL VALUE, sorted by row number, then by column letter.'
