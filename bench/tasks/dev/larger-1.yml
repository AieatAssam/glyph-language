id: larger-1
category: larger
tier: 2
prompt: 'Run a small stack machine. Read a program with one instruction per line, and anything after a # is a comment. A line ending in a colon names a label at the next instruction. Instructions: push N puts an integer on the stack; pop, dup, swap and over work on the top of the stack; add, sub and mul pop two values and push the result, with the second value popped first and subtracted from or multiplying the first; print pops a value and writes it on its own line; jmp L, jz L (pops and jumps if zero) and call L jump to a label, call remembers the return address, ret returns; halt stops. A program that runs off its end stops normally. A stack underflow, an unknown op, an unknown label, a return with no call, a bad integer, or more than 1000 steps stops the machine with an error line. Write each print, then an error line if there was one, then the line steps N.'
tests:
- input: 'push 8

    push 9

    push 2

    push 8

    push 4

    push 7

    pop

    push 4

    swap

    dup

    push 9

    '
  expected: 'steps 11

    '
  visible: true
- input: 'push 9

    push 3

    push 3

    pop

    push -2

    dup

    push -1

    pop

    push 7

    add

    jmp nowhere

    '
  expected: 'error: unknown label nowhere

    steps 11

    '
  visible: true
- input: 'push 0

    push 1

    push 6

    push 6

    print

    sub

    push 5

    over

    push 6

    dup

    dup

    over

    sub

    '
  expected: '6

    steps 13

    '
  visible: false
- input: 'push 8

    push 1

    push 9

    push 7

    sub

    push 4

    '
  expected: 'steps 6

    '
  visible: false
- input: 'push 6

    push 6

    push 7

    push -5

    push 7

    push 9

    push 3

    loop:

    dup

    print

    push 1

    sub

    dup

    jz end

    jmp loop

    end:

    halt

    '
  expected: '3

    2

    1

    steps 28

    '
  visible: false
- input: 'push 1

    push 4

    push 6

    push 7

    push 4

    print

    sub

    add

    pop

    push -1

    over

    push -1

    push 3

    loop:

    dup

    print

    push 1

    sub

    dup

    jz end

    jmp loop

    end:

    halt

    '
  expected: '4

    3

    2

    1

    steps 34

    '
  visible: false
