id: state-6
category: state
tier: 3
prompt: Read lines of the form set NAME VALUE or get NAME. Store values by name. For each get, write the stored value, or the word unset when that name has never been set. Later sets replace earlier values.
tests:
- input: 'set y 5

    get z

    set y 4

    get y

    '
  expected: 'unset

    4

    '
  visible: true
- input: 'set z 4

