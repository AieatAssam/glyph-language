    '
  expected: '-3:1

    -1:2

    0:1

    1:2

    '
  visible: false
- input: '-2 1

    '
  expected: '-2:1

    1:1

    '
  visible: false
- input: '-1 -3 -3 1 3 -3 -2 -2 0 -3

    '
  expected: '-3:4

    -2:2

    -1:1

    0:1

    1:1

    3:1

    '
  visible: false
- input: '-1 -3 -3 -3 1 -1 3

    '
  expected: '-3:3

    -1:2

    1:1

    3:1

    '
  visible: false
probe_inputs:
- '-1 1 -1

  '
