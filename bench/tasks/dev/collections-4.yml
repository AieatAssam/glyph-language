id: collections-4
category: collections
tier: 2
prompt: Read a line of integers separated by spaces. For each distinct value, in ascending order, write a line with the value, a colon, and how many times it appears.
tests:
- input: '-3 -2 -2

    '
  expected: '-3:1

    -2:2

    '
  visible: true
- input: '3 -1 3 0 -3 -2 1 3 2 1 -3

    '
